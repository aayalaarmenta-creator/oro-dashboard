name: Dashboard del oro

on:
  schedule:
    # Cada 15 min, domingo a viernes (hora UTC). GitHub puede retrasar unos minutos.
    - cron: "*/15 * * * 0-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar dashboard
        run: |
          python gold.py dashboard
          mkdir -p site
          cp trader/gold/dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
